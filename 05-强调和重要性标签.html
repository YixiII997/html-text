<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>强调和注释标签</title>
</head>

<body>
  <h1>概念区</h1>
  <p>强调标签 加粗 倾斜 下划线 效果的标签 用来强调文字</p>
  <p>注释标签 用来添加不会再浏览器中显示的注释</p>
  <p>注释快捷键是 ctrl+/ 选定代码后按 即可加上注释符号</p>
  <hr>
  <h1>练习区</h1>
  <h2>有语义的强调标签（重点）</h2>
  加粗：<strong>这是strong标签</strong>
  倾斜：<em>这是em标签</em>
  下划线：<ins>这是ins标签</ins>
  删除线：<del>这是del标签</del>
  <h2>无语义的强调标签</h2>
  加粗：<b>这是b标签</b>
  倾斜：<i>这是i标签</i>
  下划线：<u>这是u标签</u>
  删除线：<s>这是s标签</s>
  <h2>注释标签</h2>
  <!-- 这是一个注释 -->
  <p>这是一个注释</p>
</body>

</html>
