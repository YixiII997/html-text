<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>块级元素和内联元素</title>
</head>

<body>
  <h1>概念区</h1>
  <p>块级元素 在浏览器中独占一行 例如p、h、div等 而且可以嵌套其他元素</p>
  <p>内联元素 可以一行放多个 但是不能嵌套其他的块级元素 但是可以嵌套其他的内联元素 如 strong、em、a等</p>
  <p>不提倡内联元素包含块级元素</p>
  <p>特殊情况 p中不能包含其他块级元素 会出问题</p>
  <hr>
  <h1>练习区</h1>
  <h1>块级元素h1</h1>
  <p>块级元素p
    <strong>p标签内的strong</strong>
  </p>
  </p>
  <strong>1内联元素strong</strong>
  <strong>2内联元素strong</strong>
  <em>3内联元素em</em>


</body>

</html>
