<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>路径</title>
</head>

<body>
  <h1>路径</h1>
  <p>用于指定文件的位置</p>
  <p>路径分为相对路径和绝对路径</p>
  <h2>相对路径 是相对于当前文件的位置</h2>
  <p>同级目录下 ./ 表示当前文件夹下</p>
  <p>下一级目录下 目录名/文件名</p>
  <p>上一级目录下 ../ 表示上一级目录</p>

  <h2>绝对路径 是从根目录开始的位置</h2>
  <p>从根目录开始的路径</p>
  <p>可以直接从盘符中开始 如 src="C:/Users/PC/Desktop/HTML/08-路径.html"</p>
  <p>注意 这里live server 会报错 因为live server 是在当前文件夹下运行的 所以需要从当前文件夹下运行 找不到盘符的路径</p>
  <p>也可以从 网络连接中 如 src="http://www.baidu.com"</p>
</body>

</html>
