<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音频标签</title>
</head>

<body>
  <h1>音频标签</h1>
  <p>audio 是音频标签</p>
  <p>属性和视频一样 兼容性写法也相同</p>
  <h2>音频兼容性</h2>
  <p>mp3 音频格式 支持所有浏览器 插入音频的时候优先考虑</p>
  <p>ogg 音频格式 IE和Safari不支持</p>
  <p>wav 音频格式 IE不支持</p>
  <hr>
  <p>属性和视频一样 兼容性写法也相同</p>
  <p>音频标签的自动播放功能会被浏览器禁用 后续可以通过js实现自动播放</p>
  <audio src="./mp3/空心.mp3" controls></audio>
</body>

</html>
